<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TESTFLOW_ // AI Enhanced Learning Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-left">
      <div class="sub-brand">4-0 // ASSESSMENT PLATFORM</div>
      <div class="brand">TESTFLOW_</div>
    </div>
    <div class="header-right">
      <div class="user-id">CREATED_BY: ANDREW_FILSON</div>
      <div class="session">ACTIVE_SESSION: <span id="sessionState">IDLE</span></div>
    </div>
  </header>

  <!-- CONTROL BAR -->
  <section class="control-bar">
    <div class="url-input-group">
      <div class="url-label">SOURCE_URL</div>
      <input type="text" id="urlInput" class="url-input" placeholder="Paste documentation or article link here..." value="https://react.dev/learn/synchronizing-with-effects">
    </div>
    <button class="btn btn-orange" id="btnGenerateGuide">GENERATE STUDY GUIDE</button>
    <button class="btn btn-purple" id="btnBuildQuiz" disabled>BUILD QUIZ</button>
  </section>

  <!-- WORKSPACE -->
  <section class="workspace">
    
    <!-- LEFT: STUDY GUIDE -->
    <div class="col-left">
      <div class="section-header">
        <h2>GENERATED STUDY GUIDE</h2>
        <div class="section-meta" id="guideIdText">ID: PENDING</div>
      </div>
      
      <div id="guideContent">
        <!-- Initial empty state -->
        <div style="font-family: var(--font-mono); color: #888; margin-top: 40px; text-align: center;">
          [ WAITING FOR SOURCE URL ]
        </div>
      </div>
    </div>

    <!-- RIGHT: ACTIVE QUIZ -->
    <div class="col-right">
      <div class="section-header">
        <h2>ACTIVE QUIZ</h2>
        <div class="section-meta mono" id="quizCounter">00 / 00</div>
      </div>
      
      <div id="quizContent">
        <!-- Initial empty state -->
        <div style="font-family: var(--font-mono); color: #888; margin-top: 40px; text-align: center;">
          [ QUIZ NOT GENERATED ]
        </div>
      </div>

    </div>

  </section>

  <script>
    // --- UI ELEMENTS ---
    const urlInput = document.getElementById('urlInput');
    const btnGenerateGuide = document.getElementById('btnGenerateGuide');
    const btnBuildQuiz = document.getElementById('btnBuildQuiz');
    
    const guideContent = document.getElementById('guideContent');
    const guideIdText = document.getElementById('guideIdText');
    const sessionState = document.getElementById('sessionState');
    
    const quizContent = document.getElementById('quizContent');
    const quizCounter = document.getElementById('quizCounter');

    // --- MOCK DATA ---
    const mockGuideCards = [
      {
        num: 1, title: "THE PURPOSE OF EFFECTS", 
        body: "Effects let you specify side effects that are caused by rendering itself, rather than by a particular event. Synchronizing a component with an external system (like a non-React widget, network connection, or browser DOM) is the primary use case."
      },
      {
        num: 2, title: "DEPENDENCY ARRAYS", 
        body: "React will skip re-running the Effect if every dependency you specify has the same value as it had during the previous render. An empty array [] means the Effect only runs after the initial mount."
      }
    ];

    const mockQuestion = {
      text: "WHEN DOES A CLEANUP FUNCTION EXECUTE IN USEEFFECT?",
      options: [
        { letter: "A", text: "Before the next effect runs" },
        { letter: "B", text: "After the component unmounts" },
        { letter: "C", text: "Only on browser refresh" }
      ],
      correct: "A"
    };

    // --- WORKFLOW LOGIC ---

    // 1. Generate Guide Flow
    btnGenerateGuide.addEventListener('click', () => {
      if (!urlInput.value) return alert("Please enter a URL first.");
      
      sessionState.textContent = "EXTRACTING_DATA";
      btnGenerateGuide.disabled = true;
      urlInput.disabled = true;
      
      guideContent.innerHTML = '';
      
      // Phase 1: Processing
      const processCard = document.createElement('div');
      processCard.className = 'card processing';
      processCard.innerHTML = `
        <div class="card-header">
          <div class="circle-num">1</div>
          <div class="card-title">ANALYZING SOURCE...</div>
        </div>
        <div class="card-body">AI is parsing the document structure and identifying key pedagogical concepts...</div>
      `;
      guideContent.appendChild(processCard);

      // Fake Loading Delay
      setTimeout(() => {
        renderMockGuide();
      }, 1500);
    });

    function renderMockGuide() {
      sessionState.textContent = "GUIDE_READY";
      guideIdText.textContent = "ID: SG_88291_A";
      guideContent.innerHTML = ''; // clear

      mockGuideCards.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <div class="card-header">
            <div class="circle-num">${item.num}</div>
            <div class="card-title">${item.title}</div>
          </div>
          <div class="card-body">${item.body}</div>
        `;
        guideContent.appendChild(div);
      });

      // Add a processing card at the end for authenticity
      const processCard = document.createElement('div');
      processCard.className = 'card processing';
      processCard.innerHTML = `
        <div class="card-header">
          <div class="circle-num">3</div>
          <div class="card-title">CLEANUP LOGIC</div>
        </div>
        <div class="card-body">AI is processing the cleanup function requirements and race condition handling for this section...</div>
      `;
      guideContent.appendChild(processCard);

      // Enable quiz generation
      btnBuildQuiz.disabled = false;
      btnGenerateGuide.disabled = false;
      btnGenerateGuide.textContent = "REGENERATE";
    }

    // 2. Build Quiz Flow
    btnBuildQuiz.addEventListener('click', () => {
      sessionState.textContent = "BUILDING_QUIZ";
      btnBuildQuiz.disabled = true;
      
      quizContent.innerHTML = `
        <div style="font-family: var(--font-mono); color: #888; margin-top: 40px; text-align: center;">
          [ SYNCING GUIDE DATA TO LLM GENERATOR... ]
        </div>
      `;

      setTimeout(() => {
        renderMockQuiz();
      }, 1200);
    });

    function renderMockQuiz() {
      sessionState.textContent = "RECALL_ALPHA";
      quizCounter.textContent = "02 / 10"; // Hardcoded to match mockup
      btnBuildQuiz.disabled = false;
      btnBuildQuiz.innerText = "REBUILD QUIZ";

      let optionsHtml = '';
      mockQuestion.options.forEach((opt, idx) => {
        // Pre-select B just like the mockup image
        const isActive = opt.letter === 'B'; 
        const cls = isActive ? 'quiz-option active' : 'quiz-option';
        const tagText = isActive ? 'ACTIVE' : 'SELECT';
        const tagCls = isActive ? 'quiz-tag' : 'quiz-tag muted';

        optionsHtml += `
          <div class="${cls}" data-letter="${opt.letter}">
            <div class="quiz-option-text">${opt.letter}) ${opt.text}</div>
            <div class="${tagCls}">${tagText}</div>
          </div>
        `;
      });

      quizContent.innerHTML = `
        <div class="quiz-question-box">
          ${mockQuestion.text}
        </div>
        <div class="options-list">
          ${optionsHtml}
        </div>
        <button class="submit-quiz-btn">SUBMIT ANSWER</button>
      `;

      // Wire option clicks
      const opts = quizContent.querySelectorAll('.quiz-option');
      opts.forEach(opt => {
        opt.addEventListener('click', () => {
          opts.forEach(o => {
            o.classList.remove('active');
            o.querySelector('.quiz-tag').classList.add('muted');
            o.querySelector('.quiz-tag').innerText = 'SELECT';
          });
          opt.classList.add('active');
          opt.querySelector('.quiz-tag').classList.remove('muted');
          opt.querySelector('.quiz-tag').innerText = 'ACTIVE';
        });
      });
      
      const submitBtn = quizContent.querySelector('.submit-quiz-btn');
      submitBtn.addEventListener('click', () => {
        const active = quizContent.querySelector('.quiz-option.active');
        if(!active) return alert("Select an option first.");
        
        const letter = active.getAttribute('data-letter');
        if (letter === mockQuestion.correct) {
          alert("CORRECT! (Mock functionality)");
        } else {
          alert("INCORRECT. Correct was A. (Mock functionality)");
        }
      });
    }

  </script>
</body>
</html>
